name: Crypto Sentinel Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install paper backend dependencies
        run: python -m pip install -r paper_backend/requirements.txt
      - name: Run backend tests
        working-directory: paper_backend
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Lovable's exported npm lockfile is currently out of sync; use npm install until reconciled.
      - run: npm install --no-audit --no-fund
      - run: npm test -- --run
      - run: npm run build
