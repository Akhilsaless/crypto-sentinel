services:
  crypto-sentinel-scanner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scanner
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SENTINEL_STATE_DIR: /app/state
      # Optional alerts: configure using deployment secret manager, never source control.
      SENTINEL_TELEGRAM_BOT_TOKEN: ${SENTINEL_TELEGRAM_BOT_TOKEN:-}
      SENTINEL_TELEGRAM_CHAT_ID: ${SENTINEL_TELEGRAM_CHAT_ID:-}
    volumes:
      - sentinel-scanner-state:/app/state
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    # No inbound ports; no exchange account API keys; no order execution.
volumes:
  sentinel-scanner-state:
